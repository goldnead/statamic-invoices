<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #172554 0%, #0F1B3D 55%, #050914 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #BAE6FD; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #0EA5E9; box-shadow: 0 0 18px #0EA5E9; }
  h1 { font-size: 78px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#BAE6FD,#38BDF8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #CBD5E1; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #BAE6FD; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #0EA5E947, transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">Invoices</span></h1>
      <p class="sub">A payment becomes a document: a gapless number, VAT by country, reverse charge.</p>
      <div class="badges">
        <span class="badge">Gapless</span>
        <span class="badge">Per rate</span>
        <span class="badge">Never changes</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0EA5E9"/><stop offset="1" stop-color="#075985"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#075985" flood-opacity="0.32"/>
          </filter>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <!-- a document with a rule above the last line: the total. Three lines and a
       sum is the smallest drawing that is unmistakably an invoice rather than a
       page of prose. -->
  <g filter="url(#sh)">
    <rect x="112" y="86" width="288" height="340" rx="28" fill="#FFFFFF"/>
  </g>
  <rect x="152" y="152" width="150" height="20" rx="10" fill="url(#bg)"/>
  <rect x="152" y="212" width="208" height="16" rx="8" fill="url(#bg)"/>
  <rect x="152" y="256" width="208" height="16" rx="8" fill="url(#bg)"/>
  <rect x="152" y="300" width="208" height="16" rx="8" fill="url(#bg)"/>
  <rect x="152" y="344" width="208" height="8" rx="4" fill="url(#bg)"/>
  <rect x="256" y="368" width="104" height="22" rx="11" fill="url(#bg)"/>
      </svg>
    </div>
  </div>
</body>
</html>
